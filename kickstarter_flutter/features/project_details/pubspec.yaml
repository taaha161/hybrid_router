name: project_details
description: >-
  Flutter feature: Kickstarter project details page (doc case page 2).
  Navigates using the plain hybrid_router API with no knowledge of the
  native/Flutter split.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hybrid_router:
    path: ../../packages/hybrid_router
  flutter_riverpod: ">=3.3.2 <3.4.1"
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
