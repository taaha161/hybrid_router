name: hybrid_router
description: >-
  A GoRouter-mirroring navigation wrapper for Flutter add-to-app. Splits
  navigation between Flutter routes (driven by GoRouter in a single engine)
  and native routes (driven over a method channel), keeping one consistent
  logical back-stack across the iOS<->Flutter boundary.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

# Member of the kickstarter_flutter pub workspace.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.5.0
  flutter_riverpod: ">=3.3.2 <3.4.1"
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
